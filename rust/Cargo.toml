[package]
name = "jv-ai-client"
version = "0.1.0"
edition = "2024"
description = "Async JV LLM API client and command-line example"
publish = false

[lib]
name = "jv_ai_client"
path = "src/lib.rs"

[[bin]]
name = "jv-api-example"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "fs", "io-util", "signal"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "multipart", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
thiserror = "2"
rpassword = "7"
url = "2"
httpdate = "1"
mime_guess = "2"
tempfile = "3"
zeroize = "1"

[dev-dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["net", "process", "test-util"] }
